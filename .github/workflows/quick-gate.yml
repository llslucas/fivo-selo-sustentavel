name: Quick gate

on:
  pull_request:

concurrency:
  group: quick-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api:
    name: API — tsc + eslint + jest (unit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      # postinstall roda `prisma generate`
      - run: npm ci

      - name: Type-check
        run: npx tsc -p tsconfig.json --noEmit

      - name: Lint
        run: npx eslint "{src,test}/**/*.ts"

      - name: Unit tests
        run: npx jest

  web:
    name: Web — vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Tests
        run: npm test
